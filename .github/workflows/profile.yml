name: profile

on:
  schedule:
    - cron: "5 18 * * *" # 23:50 in Kathmandu, after the day's work is in
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/deck.py OtoYuki
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python3 scripts/upstream.py OtoYuki
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          git diff --quiet -- assets/deck.svg assets/upstream.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh deck and upstream" -- assets/deck.svg assets/upstream.svg
          git push
